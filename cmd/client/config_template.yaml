# 客户端配置文件
link: "eyJzdWJfZGV2aWNlX2lkIjoxLCJrZXkiOiJ0ZXN0In0="
#link: "eyJzdWJfZGV2aWNlX2lkIjoyLCJrZXkiOiJ0ZXN0In0="
address: "127.0.0.1"
port: 9800
insecure_skip_verify: true
public_key: public_key.pem
device_mode: "" # p2p_only | proxy_only(only work on both side under this mode) | mixed(default)

debug: false

manager:
  # 可选：HTTPS证书配置
  # cert_file: "path/to/cert.crt"
  # key_file: "path/to/cert.key"
  enabled: true
  listen: "127.0.0.1"
  port: 8001
  allowed_ip:
    - 127.0.0.1

p2p:
  enabled: true  # 启用P2P功能
  # 监听地址（本地）
  # 注意：在NAT环境下，libp2p会自动发现公网地址并通过服务器交换
  listen_addr:
    - "/ip4/0.0.0.0/tcp/0"         # TCP监听
    - "/ip4/0.0.0.0/udp/0/quic-v1" # UDP/QUIC监听
  # 尝试P2P连接的间隔（秒）
  try_interval: 30
  # NAT地址刷新间隔（秒），定期向服务器刷新自己的NAT地址
  # 这样可以确保NAT映射保持活跃，新客户端可以连接到现有的P2P网络
  # 建议设置为60-180秒之间，默认120秒（2分钟）
  address_refresh: 120
  # 是否主动拨号对等节点
  active_dial_peer: true  # 建议开启主动拨号

# NAT穿透说明：
# 1. libp2p会自动尝试NAT打洞（需要服务器作为信令节点）
# 2. 客户端连接到服务器后，服务器会交换各客户端的地址信息
# 3. 客户端之间会尝试直接连接，通过NAT打洞建立P2P连接
# 4. 定期刷新NAT地址，确保NAT映射保持活跃，新客户端可以连接到已建立的P2P网络
# 5. 如果打洞失败，会自动回退到通过服务器转发数据
# 6. 对于某些严格类型的NAT（如对称NAT），P2P可能无法直接连接，此时需要依赖服务器转发
#
# 工作流程示例：
# 时间线:
# T0: 客户端A连接服务器，注册NAT地址（1.2.3.4:5000）
# T1: 客户端B连接服务器，注册NAT地址（1.2.3.4:5001）
# T2: A和B打洞成功，建立P2P连接，开始通信
# T3: A和B定期刷新地址，确保NAT映射保持活跃
# T4: 客户端C连接服务器，获取A和B的最新地址
# T5: C尝试连接A/B，打洞成功
# T6: 三个客户端形成P2P网络