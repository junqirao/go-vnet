# 客户端配置文件
link: "eyJzdWJfZGV2aWNlX2lkIjoxLCJrZXkiOiJ0ZXN0In0="
#link: "eyJzdWJfZGV2aWNlX2lkIjoyLCJrZXkiOiJ0ZXN0In0="
address: "127.0.0.1"
port: 9800
insecure_skip_verify: true
public_key: public_key.pem
device_mode: "" # p2p_only | proxy_only(only work on both side under this mode) | mixed(default)

debug: false

manager:
  # 可选：HTTPS证书配置
  # cert_file: "path/to/cert.crt"
  # key_file: "path/to/cert.key"
  enabled: true
  listen: "127.0.0.1"
  port: 8001
  allowed_ip:
    - 127.0.0.1

p2p:
  enabled: true  # 启用P2P功能
  # 监听地址（本地）
  # 注意：在NAT环境下，libp2p会自动发现公网地址并通过服务器交换
  listen_addr:
    - "/ip4/0.0.0.0/tcp/0"
    - "/ip4/0.0.0.0/udp/0/quic-v1"
    - "/ip4/0.0.0.0/udp/0/quic-v1/webtransport"
    - "/ip4/0.0.0.0/udp/0/webrtc-direct"
  # 尝试P2P连接的间隔（秒）
  try_interval: 30
  # NAT地址刷新间隔（秒），定期向服务器刷新自己的NAT地址
  # 这样可以确保NAT映射保持活跃，新客户端可以连接到现有的P2P网络
  # 建议设置为60-180秒之间，默认120秒（2分钟）
  address_refresh: 120
  # 是否主动拨号对等节点
  active_dial_peer: true  # 建议开启主动拨号
  # STUN/TURN服务器配置（可选，用于改善NAT穿透）
  ice_servers:
    # 公共STUN服务器（免费）
    - urls:
        - "stun:stun.l.google.com:19302"
        - "stun:stun1.l.google.com:19302"
        - "stun:stun2.l.google.com:19302"
    # TURN服务器配置（需要自建或使用付费服务）
    # - urls:
    #     - "turn:your-turn-server.com:3478?transport=udp"
    #     - "turn:your-turn-server.com:3478?transport=tcp"
    #   username: "your-username"
    #   credential: "your-password"